[package]
name = "cronet"
description = "Chromium's network stack, as built by naiveproxy: requests and bidirectional streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["cronet", "chromium", "http2", "quic", "naiveproxy"]
categories = ["api-bindings", "network-programming", "web-programming::http-client"]

[features]
## Open libcronet at run time instead of linking it (see `cronet-sys`).
dynamic = ["cronet-sys/dynamic"]
## `BidirectionalConn`: a stream as `tokio::io::AsyncRead + AsyncWrite`.
tokio = ["dep:tokio"]
## `http::Client`: requests in terms of the `http` and `http-body` crates.
http = ["dep:http", "dep:http-body"]

[dependencies]
cronet-sys.workspace = true
bytes = "1.12"
serde_json = "1"

http = { version = "1.5", optional = true }
http-body = { version = "1.1", optional = true }
tokio = { version = "1.53", optional = true }

[dev-dependencies]
h2 = "0.4"
http = "1.5"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
time = "0.3"
tokio = { version = "1.53", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
