# Builds libcronet from the naiveproxy commit naiveproxy.lock names, laid out
# the way naiveproxy's own CI builds its releases. By default it builds the
# standard release targets; pass `targets: all` for every supported target, or
# a comma- or space-separated list of triples to build only those. Each package
# is an artifact `libcronet-<triple>`; on a release published by hand, it is
# also attached to it. `release.yml` calls this for the releases it makes.

name: libcronet

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build.
        type: string
        required: true
      targets:
        description: Target triples to build (comma/space-separated, `default`, or `all`).
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: The commit or ref to build (defaults to the triggered ref).
        type: string
        default: ""
      targets:
        description: Target triples to build (comma/space-separated, `default`, or `all`).
        type: string
        default: ""
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CACHE_EPOCH: 1

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      linux: ${{ steps.resolve.outputs.linux }}
      windows: ${{ steps.resolve.outputs.windows }}
      apple: ${{ steps.resolve.outputs.apple }}
      has_linux: ${{ steps.resolve.outputs.has_linux }}
      has_windows: ${{ steps.resolve.outputs.has_windows }}
      has_apple: ${{ steps.resolve.outputs.has_apple }}
    steps:
      - id: resolve
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_TARGETS: ${{ inputs.targets }}
          FALLBACK_REF: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          all_linux = [
              "x86_64-unknown-linux-gnu",
              "i686-unknown-linux-gnu",
              "aarch64-unknown-linux-gnu",
              "armv7-unknown-linux-gnueabihf",
              "riscv64gc-unknown-linux-gnu",
              "loongarch64-unknown-linux-gnu",
              "mipsel-unknown-linux-gnu",
              "mips64el-unknown-linux-gnuabi64",
              "x86_64-unknown-linux-musl",
              "i686-unknown-linux-musl",
              "aarch64-unknown-linux-musl",
              "armv7-unknown-linux-musleabihf",
              "mipsel-unknown-linux-musl",
              "riscv64gc-unknown-linux-musl",
              "loongarch64-unknown-linux-musl",
              "aarch64-linux-android",
              "x86_64-linux-android",
              "armv7-linux-androideabi",
              "i686-linux-android",
          ]
          all_windows = [
              "x86_64-pc-windows-msvc",
              "i686-pc-windows-msvc",
              "aarch64-pc-windows-msvc",
          ]
          all_apple = [
              "aarch64-apple-darwin",
              "x86_64-apple-darwin",
              "aarch64-apple-ios",
              "aarch64-apple-ios-sim",
              "x86_64-apple-ios",
              "aarch64-apple-tvos",
              "aarch64-apple-tvos-sim",
              "x86_64-apple-tvos",
          ]
          default_targets = [
              "x86_64-unknown-linux-gnu",
              "aarch64-unknown-linux-gnu",
              "x86_64-unknown-linux-musl",
              "aarch64-unknown-linux-musl",
              "aarch64-linux-android",
              "x86_64-linux-android",
              "armv7-linux-androideabi",
              "x86_64-pc-windows-msvc",
              "aarch64-apple-darwin",
              "x86_64-apple-darwin",
              "aarch64-apple-ios",
              "aarch64-apple-ios-sim",
          ]
          known = set(all_linux + all_windows + all_apple)
          raw = os.environ.get("INPUT_TARGETS", "").strip()
          if not raw or raw == "default":
              selected = set(default_targets)
          elif raw == "all":
              selected = set(known)
          else:
              tokens = [t for t in re.split(r"[\s,]+", raw) if t]
              unknown = [t for t in tokens if t not in known]
              if unknown:
                  sys.exit(f"unknown target triple(s): {', '.join(unknown)}")
              selected = set(tokens)

          linux = [t for t in all_linux if t in selected]
          windows = [t for t in all_windows if t in selected]
          apple = [t for t in all_apple if t in selected]
          ref = os.environ.get("INPUT_REF", "").strip() or os.environ["FALLBACK_REF"]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"ref={ref}\n")
              out.write(f"linux={json.dumps(linux)}\n")
              out.write(f"windows={json.dumps(windows)}\n")
              out.write(f"apple={json.dumps(apple)}\n")
              out.write(f"has_linux={'true' if linux else 'false'}\n")
              out.write(f"has_windows={'true' if windows else 'false'}\n")
              out.write(f"has_apple={'true' if apple else 'false'}\n")
          PY

  linux:
    needs: targets
    if: needs.targets.outputs.has_linux == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        triple: ${{ fromJson(needs.targets.outputs.linux) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.targets.outputs.ref }}
      # The locked naiveproxy (with any local patches), before its caches are restored into it.
      - run: cargo xtask fetch
      - uses: actions/cache@v6
        with:
          path: |
            naiveproxy/src/third_party/llvm-build/Release+Asserts/
            naiveproxy/src/gn/
            naiveproxy/src/chrome/build/pgo_profiles/
            naiveproxy/src/third_party/android_toolchain/
            naiveproxy/src/out/sysroot-build/
          key: toolchain-${{ matrix.triple }}-${{ hashFiles('naiveproxy/CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.triple }}-${{ hashFiles('naiveproxy/CHROMIUM_VERSION') }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.triple }}-${{ hashFiles('naiveproxy/CHROMIUM_VERSION') }}-
      - run: sudo apt-get update && sudo apt-get install -y ninja-build ccache
      - name: Regenerate the Debian keyring
        working-directory: naiveproxy/src
        run: |
          rm -f ./build/linux/sysroot_scripts/keyring.gpg
          GPG_TTY=/dev/null ./build/linux/sysroot_scripts/generate_keyring.sh
      - run: cargo xtask build --target ${{ matrix.triple }}
      - run: cargo xtask package --target ${{ matrix.triple }}
      - name: Test against the build
        if: matrix.triple == 'x86_64-unknown-linux-gnu'
        env:
          CRONET_LIBRARY: ${{ github.workspace }}/lib/${{ matrix.triple }}/libcronet.so
        run: cargo test --workspace --all-features
      # The same tests with the static library linked into a static musl
      # executable, as `cargo xtask env` links it: even with `dynamic` on.
      - name: Test against the build, linked statically
        if: matrix.triple == 'x86_64-unknown-linux-musl'
        run: |
          rustup target add ${{ matrix.triple }}
          eval "$(cargo xtask env --target ${{ matrix.triple }} --export)"
          cargo test -p cronet --target ${{ matrix.triple }} --all-features
      - name: Pack
        run: tar cJf libcronet-${{ matrix.triple }}.tar.xz -C lib ${{ matrix.triple }}
      - uses: actions/upload-artifact@v7
        with:
          name: libcronet-${{ matrix.triple }}
          path: libcronet-${{ matrix.triple }}.tar.xz
      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" libcronet-${{ matrix.triple }}.tar.xz --clobber

  windows:
    needs: targets
    if: needs.targets.outputs.has_windows == 'true'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        triple: ${{ fromJson(needs.targets.outputs.windows) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.targets.outputs.ref }}
      # The locked naiveproxy (with any local patches), before its caches are restored into it.
      - run: cargo xtask fetch
      - uses: actions/cache@v6
        with:
          path: |
            naiveproxy/src/third_party/llvm-build/Release+Asserts/
            naiveproxy/src/gn/
            naiveproxy/src/chrome/build/pgo_profiles/
            ~/.cargo/bin/sccache.exe
          key: toolchain-${{ matrix.triple }}-${{ hashFiles('naiveproxy/CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/Mozilla/sccache
          key: sccache-${{ matrix.triple }}-${{ hashFiles('naiveproxy/CHROMIUM_VERSION') }}-${{ github.run_id }}
          restore-keys: sccache-${{ matrix.triple }}-${{ hashFiles('naiveproxy/CHROMIUM_VERSION') }}-
      - run: choco install ninja --no-progress
      # get-clang.sh installs sccache in ~/.cargo/bin.
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo xtask build --target ${{ matrix.triple }}
      - run: cargo xtask package --target ${{ matrix.triple }}
      - name: Test against the build
        if: matrix.triple == 'x86_64-pc-windows-msvc'
        env:
          CRONET_LIBRARY: ${{ github.workspace }}/lib/${{ matrix.triple }}/cronet.dll
        run: cargo test --workspace --all-features
      - name: Pack
        run: tar cJf libcronet-${{ matrix.triple }}.tar.xz -C lib ${{ matrix.triple }}
      - uses: actions/upload-artifact@v7
        with:
          name: libcronet-${{ matrix.triple }}
          path: libcronet-${{ matrix.triple }}.tar.xz
      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" libcronet-${{ matrix.triple }}.tar.xz --clobber

  apple:
    needs: targets
    if: needs.targets.outputs.has_apple == 'true'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        triple: ${{ fromJson(needs.targets.outputs.apple) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.targets.outputs.ref }}
      # The locked naiveproxy (with any local patches), before its caches are restored into it.
      - run: cargo xtask fetch
      - uses: actions/cache@v6
        with:
          path: |
            naiveproxy/src/third_party/llvm-build/Release+Asserts/
            naiveproxy/src/gn/
            naiveproxy/src/chrome/build/pgo_profiles/
          key: toolchain-${{ matrix.triple }}-${{ hashFiles('naiveproxy/CHROMIUM_VERSION') }}-v${{ env.CACHE_EPOCH }}
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ matrix.triple }}-${{ hashFiles('naiveproxy/CHROMIUM_VERSION') }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.triple }}-${{ hashFiles('naiveproxy/CHROMIUM_VERSION') }}-
      - run: brew install ninja ccache
      - run: pip install setuptools
      - run: cargo xtask build --target ${{ matrix.triple }}
      - run: cargo xtask package --target ${{ matrix.triple }}
      - name: Test against the build, linked statically
        if: matrix.triple == 'aarch64-apple-darwin'
        run: |
          eval "$(cargo xtask env --target ${{ matrix.triple }} --export)"
          cargo test -p cronet --all-features
      - name: Pack
        run: tar cJf libcronet-${{ matrix.triple }}.tar.xz -C lib ${{ matrix.triple }}
      - uses: actions/upload-artifact@v7
        with:
          name: libcronet-${{ matrix.triple }}
          path: libcronet-${{ matrix.triple }}.tar.xz
      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" libcronet-${{ matrix.triple }}.tar.xz --clobber
